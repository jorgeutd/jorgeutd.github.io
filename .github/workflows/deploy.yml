name: Validate and deploy portfolio

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm test
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: |
            playwright-report/
            test-results/
            screenshots/
          retention-days: 7
      - name: Package checked public files
        uses: actions/upload-artifact@v4
        with:
          name: checked-site
          path: _site/
          include-hidden-files: true
          retention-days: 7

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: checked-site
          path: _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Wait for the checked release to reach the public site
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const paths = ['index.html', 'assets/portfolio-content.js', 'assets/portfolio-expansion.js', 'assets/portfolio-expansion.css', 'assets/portfolio-atlas.js', 'assets/portfolio-atlas.css', 'assets/portfolio-research.js', 'assets/portfolio-research.css', 'assets/portfolio-transformer.js', 'assets/portfolio-transformer.css', 'favicon.svg', 'site.webmanifest', 'assets/portfolio-delivery.js', 'assets/portfolio-delivery.css', 'assets/portfolio-pretrained-worker.js', 'assets/portfolio-graph-math.js', 'assets/portfolio-graphs.js', 'assets/portfolio-graphs.css', 'assets/graph-evidence-replay.json'];
          (async () => {
            for (let attempt = 0; attempt < 30; attempt++) {
              const matches = await Promise.all(paths.map(async path => {
                try {
                  const response = await fetch('https://jorgeutd.github.io/' + path + '?release=' + process.env.GITHUB_SHA, {signal: AbortSignal.timeout(10000), headers: {'Cache-Control': 'no-cache'}});
                  return response.ok && await response.text() === fs.readFileSync(path, 'utf8');
                } catch { return false; }
              }));
              if (matches.every(Boolean)) { console.log('Public content matches the checked release.'); return; }
              await new Promise(resolve => setTimeout(resolve, 4000));
            }
            throw new Error('The public site did not serve the checked release in time.');
          })().catch(error => { console.error(error.message); process.exitCode = 1; });
          NODE
      - name: Exercise the live website on desktop and mobile
        run: npm test
        env:
          PLAYWRIGHT_BASE_URL: https://jorgeutd.github.io
      - name: Save live browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-browser-evidence
          path: |
            playwright-report/
            test-results/
            screenshots/
          retention-days: 7
